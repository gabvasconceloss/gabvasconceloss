name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 3 * * *" # todos os dias às 03:00 UTC
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Secret com o seu Personal Access Token (veja o passo a passo)
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -4 # Manaus (opcional)